<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <form class="was-validated">
       
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" required minlength="2">
                <div class="invalid-feedback">Required</div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" required minlength="2">
                <div class="invalid-feedback">Required</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" required>
            <div class="invalid-feedback">Enter valid email</div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Vvedi parol</label>
                <input type="password" class="form-control" required minlength="6">
                <div class="invalid-feedback">Min 6 bukv</div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Podtverdi</label>
                <input type="password" class="form-control" required minlength="6">
                <div class="invalid-feedback">Confirm password</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Gender</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" required> Malchik
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" required> Devushka
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Hobbies</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox"> Sport
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox"> Chtenie
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Country</label>
            <select class="form-select" required>
                <option value="">Choose...</option>
                <option>Kazakhstan</option>
                <option>Drugaya</option>
            </select>
            <div class="invalid-feedback">Vybiray</div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
    </form>
</body>
</html>
